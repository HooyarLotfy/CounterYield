enum PositionState {
  ACTIVE
  REBALANCING
  CLOSED
  EMERGENCY_UNWOUND
}

type Position @entity {
  id: ID!
  owner: String! @index
  marketId: String!
  baseQuantity: BigInt!
  spotQuantity: BigInt!
  perpQuantity: BigInt!
  spotTxRef: String!
  perpOrderRef: String!
  leverage: BigInt!
  state: PositionState!
  realizedPnl: BigInt
  openedAt: BigInt!
  closedAt: BigInt
  rebalanceCount: Int!
  guardEventCount: Int!
  rebalances: [RebalanceEvent!]! @derivedFrom(field: "position")
  guardEvents: [GuardEvent!]! @derivedFrom(field: "position")
  driftSnapshots: [HedgeDriftPoint!]! @derivedFrom(field: "position")
  marginSnapshots: [MarginRatioPoint!]! @derivedFrom(field: "position")
}

type RebalanceEvent @entity {
  id: ID!
  position: Position!
  oldSpotQty: BigInt!
  oldPerpQty: BigInt!
  newSpotQty: BigInt!
  newPerpQty: BigInt!
  reason: String!
  timestamp: BigInt!
  txHash: String!
}

type GuardEvent @entity {
  id: ID!
  position: Position!
  tier: Int!
  marginRatioBps: BigInt!
  action: String!
  timestamp: BigInt!
  txHash: String!
}

type HedgeDriftPoint @entity {
  id: ID!
  position: Position!
  driftBps: BigInt!
  spotQty: BigInt!
  perpQty: BigInt!
  timestamp: BigInt!
}

type MarginRatioPoint @entity {
  id: ID!
  position: Position!
  marginRatioBps: BigInt!
  timestamp: BigInt!
}

type UserPolicy @entity {
  id: ID!
  maxLeverage: BigInt!
  maxSlippageBps: BigInt!
  fundingFloorBps: BigInt!
  maxDriftBps: BigInt!
  reserveBufferBps: BigInt!
  updatedAt: BigInt!
}

type SpotTradeFill @entity {
  id: ID!
  tradeId: String!
  taker: String! @index
  maker: String!
  size: BigInt!
  price: BigInt!
  isBuy: Boolean!
  timestamp: BigInt!
  txHash: String!
}
