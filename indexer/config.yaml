name: counter-yield-indexer
description: High-throughput indexing for Counter Yield delta-neutral protocol on Monad Testnet
field_selection:
  transaction_fields:
    - hash
contracts:
  - name: CarryLedger
    events:
      - event: HedgeOpened(bytes32 indexed positionId, address indexed owner, bytes32 indexed marketId, uint256 baseQuantity, string spotTxRef, string perpOrderRef, uint256 leverage, uint256 timestamp)
      - event: HedgeRebalanced(bytes32 indexed positionId, uint256 oldSpotQty, uint256 oldPerpQty, uint256 newSpotQty, uint256 newPerpQty, string reason, uint256 timestamp)
      - event: HedgeClosed(bytes32 indexed positionId, address indexed owner, int256 realizedPnl, string reason, uint256 timestamp)
      - event: GuardTriggered(bytes32 indexed positionId, uint8 indexed tier, uint256 marginRatioBps, string action, uint256 timestamp)
      - event: EmergencyUnwind(bytes32 indexed positionId, string reason, uint256 timestamp)
      - event: PolicySet(address indexed owner, uint256 maxLeverage, uint256 maxSlippageBps, int256 fundingFloorBps, uint256 maxDriftBps, uint256 reserveBufferBps, uint256 timestamp)
  - name: KuruOrderBook
    events:
      - event: Trade(uint64 indexed tradeId, address indexed taker, address indexed maker, uint64 size, uint64 price, bool isBuy)
chains:
  - id: 10143
    rpc_config:
      url: https://testnet-rpc.monad.xyz
    start_block: 0
    contracts:
      - name: CarryLedger
        address: "0x0000000000000000000000000000000000000000"
      - name: KuruOrderBook
        address: "0xa241896A7Dbe8a550D2E5fF7A914bB1989ceD2D9"
